name: Integration tests with newman

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label, e.g. self-hosted when the system under test needs the internal network"
        required: false
        type: string
        default: "ubuntu-latest"
      working_directory:
        required: false
        type: string
        default: "."
      python_version:
        description: "Set up this Python version before setup_command; empty skips it"
        required: false
        type: string
        default: ""
      node_version:
        required: false
        type: string
        default: "22"
      newman_version:
        required: false
        type: string
        default: "6.2.1"
      private_repositories:
        description: "Newline-separated repositories of the caller's org cloned into private_repositories_path (needs app_id/app_private_key secrets)"
        required: false
        type: string
        default: ""
      private_repositories_path:
        description: "Directory, relative to working_directory, the private repositories are cloned into"
        required: false
        type: string
        default: ".integration"
      setup_command:
        description: "Command that starts the system under test in the background"
        required: true
        type: string
      wait_url:
        description: "URL polled until it answers with any HTTP status; empty skips waiting"
        required: false
        type: string
        default: ""
      wait_timeout_seconds:
        required: false
        type: number
        default: 180
      collections:
        description: "Newline-separated Postman collection paths, relative to working_directory"
        required: true
        type: string
      environment_file:
        description: "Postman environment file passed to every collection; may be generated by setup_command"
        required: false
        type: string
        default: ""
      newman_args:
        description: "Extra arguments passed to every newman run"
        required: false
        type: string
        default: ""
      teardown_command:
        description: "Command that stops the system under test; always runs"
        required: false
        type: string
        default: ""
      log_paths:
        description: "Newline-separated paths, relative to the repository root, uploaded as the integration-test-logs artifact"
        required: false
        type: string
        default: ""
      timeout_minutes:
        required: false
        type: number
        default: 30
    secrets:
      app_id:
        description: "GitHub App ID or client ID used to clone private_repositories"
        required: false
      app_private_key:
        description: "GitHub App private key used to clone private_repositories"
        required: false

jobs:
  integration-tests:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create GitHub App token
        id: app-token
        if: inputs.private_repositories != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.private_repositories }}

      - name: Clone private repositories
        if: inputs.private_repositories != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORIES: ${{ inputs.private_repositories }}
          TARGET_DIR: ${{ inputs.private_repositories_path }}
        run: |
          set -euo pipefail
          mkdir -p "${TARGET_DIR}"
          while read -r repo; do
            [[ -z "${repo}" ]] && continue
            rm -rf "${TARGET_DIR:?}/${repo}"
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${repo}.git" "${TARGET_DIR}/${repo}"
          done <<< "${REPOSITORIES//,/$'\n'}"

      - name: Setup Python
        if: inputs.python_version != ''
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}

      - name: Start system under test
        env:
          SETUP_COMMAND: ${{ inputs.setup_command }}
        run: bash -euo pipefail -c "${SETUP_COMMAND}"

      - name: Wait for system under test
        if: inputs.wait_url != ''
        env:
          WAIT_URL: ${{ inputs.wait_url }}
          WAIT_TIMEOUT: ${{ inputs.wait_timeout_seconds }}
        run: |
          deadline=$((SECONDS + WAIT_TIMEOUT))
          until curl -s -o /dev/null "${WAIT_URL}"; do
            if (( SECONDS >= deadline )); then
              echo "${WAIT_URL} did not respond within ${WAIT_TIMEOUT}s"
              exit 1
            fi
            sleep 2
          done
          echo "${WAIT_URL} is up"

      - name: Run newman
        env:
          COLLECTIONS: ${{ inputs.collections }}
          ENVIRONMENT_FILE: ${{ inputs.environment_file }}
          NEWMAN_VERSION: ${{ inputs.newman_version }}
          NEWMAN_ARGS: ${{ inputs.newman_args }}
          REPORTS_DIR: ${{ runner.temp }}/newman-reports
        run: |
          set -uo pipefail
          mkdir -p "${REPORTS_DIR}"

          env_args=()
          if [[ -n "${ENVIRONMENT_FILE}" ]]; then
            env_args=(-e "${ENVIRONMENT_FILE}")
          fi
          read -r -a extra_args <<< "${NEWMAN_ARGS}"

          failed=0
          summary="| Collection | Result |"$'\n'"| --- | --- |"
          while read -r collection; do
            [[ -z "${collection}" ]] && continue
            name="$(basename "${collection}" .json)"
            echo "::group::${name}"
            if npx --yes "newman@${NEWMAN_VERSION}" run "${collection}" "${env_args[@]}" \
              --reporters cli,junit --reporter-junit-export "${REPORTS_DIR}/${name}.xml" \
              "${extra_args[@]}"; then
              summary+=$'\n'"| ${name} | ✅ passed |"
            else
              summary+=$'\n'"| ${name} | ❌ failed |"
              failed=1
            fi
            echo "::endgroup::"
          done <<< "${COLLECTIONS}"

          { echo "### Integration tests"; echo; echo "${summary}"; } >> "${GITHUB_STEP_SUMMARY}"
          exit "${failed}"

      - name: Stop system under test
        if: always() && inputs.teardown_command != ''
        env:
          TEARDOWN_COMMAND: ${{ inputs.teardown_command }}
        run: bash -uo pipefail -c "${TEARDOWN_COMMAND}"

      - name: Upload newman reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: newman-reports
          path: ${{ runner.temp }}/newman-reports
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload logs
        if: always() && inputs.log_paths != ''
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-logs
          path: ${{ inputs.log_paths }}
          if-no-files-found: ignore
          retention-days: 7
